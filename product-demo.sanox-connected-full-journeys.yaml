app:
  url: http://localhost:3005
  healthcheck: http://127.0.0.1:8000/health/ready
  production: false
repository:
  root: artifacts/sanox-second-iteration-en/discovery-source
output:
  directory: artifacts/sanox-connected-full-journeys/run
privacy:
  syntheticData: true
  allowProduction: false
  scanArtifacts: true
  redactions:
    - sourceEnv: SANOX_DEMO_REDACT_NAME
      replacement: Demo Patient
runtime:
  rehearsalPasses: 2
  headless: true
narration:
  provider: none
editorial:
  thresholds:
    public-master:
      distinctWarnRatio: 0.12
      distinctFailRatio: 0.11
      staticWarnSeconds: 3
      repeatedStaticFailCount: 12
      montageMaxRatio: 0.25
    actor-journey:
      distinctWarnRatio: 0.5
      distinctFailRatio: 0.4
      staticWarnSeconds: 3
      repeatedStaticFailCount: 2
      montageMaxRatio: 0.25
    feature-clip:
      distinctWarnRatio: 0.5
      distinctFailRatio: 0.4
      staticWarnSeconds: 3
      repeatedStaticFailCount: 2
      montageMaxRatio: 0.25
    release-demo:
      distinctWarnRatio: 0.5
      distinctFailRatio: 0.4
      staticWarnSeconds: 3
      repeatedStaticFailCount: 2
      montageMaxRatio: 0.25
    montage:
      distinctWarnRatio: 0.5
      distinctFailRatio: 0.4
      staticWarnSeconds: 3
      repeatedStaticFailCount: 2
      montageMaxRatio: 1
upload:
  enabled: false
devices:
  desktop:
    width: 1440
    height: 900
    isMobile: false
