version: 1
id: patient-to-physician
title: Patient to physician
audience: clinic-partner
locale: fr
duration: 2m
narration: voiceover
branding:
  name: SanoX Care
  primary: "#116b5a"
  background: "#081b18"
preconditions:
  resetCommand: curl -fsS -X POST http://127.0.0.1:4173/api/reset
actors:
  - id: patient
    role: patient
  - id: physician
    role: physician
scenes:
  - id: adaptive-intake
    title: Un intake qui s’adapte
    description: La patiente décrit ses symptômes en quelques réponses guidées.
    actor: patient
    actions:
      - title: Ouvrir le parcours patient
        type: goto
        path: /?role=patient&locale=fr
        timing:
          pauseAfterMs: 900
      - title: Identifier la patiente
        type: fill
        target:
          by: label
          value: Nom complet
        text: Camille Martin
        timing:
          cursorDurationMs: 650
          settleBeforeMs: 180
          keystrokeDelayMs: 65
          pauseAfterMs: 900
      - title: Choisir le symptôme principal
        type: select
        target:
          by: label
          value: Symptôme principal
        value: headache
        timing:
          cursorDurationMs: 500
          settleBeforeMs: 160
          pauseAfterMs: 900
      - title: Démarrer l’intake
        type: click
        target:
          by: role
          role: button
          value: Commencer
        timing:
          cursorDurationMs: 450
          settleBeforeMs: 190
          pauseAfterMs: 1200
      - title: Préciser la durée
        type: click
        target:
          by: role
          role: radio
          value: Trois jours
        timing:
          cursorDurationMs: 500
          settleBeforeMs: 180
          pauseAfterMs: 900
      - title: Continuer
        type: click
        target:
          by: role
          role: button
          value: Continuer
        timing:
          cursorDurationMs: 480
          settleBeforeMs: 180
          pauseAfterMs: 1200
      - title: Préciser l’intensité
        type: click
        target:
          by: role
          role: radio
          value: Modérée
        timing:
          cursorDurationMs: 500
          settleBeforeMs: 180
          pauseAfterMs: 900
      - title: Transmettre au médecin
        type: click
        target:
          by: role
          role: button
          value: Envoyer au médecin
        timing:
          cursorDurationMs: 550
          settleBeforeMs: 220
          pauseAfterMs: 1600
      - title: Confirmer la transmission
        type: assert
        target:
          by: text
          value: Intake transmis
        state: visible
        timing:
          pauseAfterMs: 900
  - id: physician-brief
    title: Du questionnaire au brief clinique
    description: Le médecin retrouve une synthèse prête à revoir.
    actor: physician
    actions:
      - title: Ouvrir l’espace clinique
        type: goto
        path: /?role=physician&locale=fr
        timing:
          pauseAfterMs: 1000
      - title: Charger le nouveau brief
        type: click
        target:
          by: role
          role: button
          value: Actualiser le dossier
        timing:
          cursorDurationMs: 650
          settleBeforeMs: 220
          pauseAfterMs: 1800
      - title: Retrouver la patiente
        type: assert
        target:
          by: text
          value: Camille Martin
        state: visible
        timing:
          pauseAfterMs: 900
      - title: Vérifier la synthèse clinique
        type: assert
        target:
          by: text
          value: Céphalée probablement bénigne
        state: visible
        timing:
          pauseAfterMs: 900
