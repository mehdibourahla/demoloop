version: 2
id: sanox-connected-full-journeys-en
title: SanoX — One patient story, carried into care
outputType: public-master
audience: clinics evaluating AI-assisted clinical operations
locale: en-CA
requestedDurationSeconds: 150
audio:
  policy: silent
branding:
  name: SanoX
  primary: "#42c5d5"
  background: "#171039"
preconditions:
  seedCommand: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -f /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/seed-english-demo.sql
actors:
  - id: patient
    label: Patient
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/auth/patient.json
  - id: doctor
    label: Doctor
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/auth/doctor.json
scenes:
  - id: profile-context
    title: "1 · Patient — Build the clinical context"
    description: The patient records context once so intake and the doctor can use it.
    purpose: hook
    capabilityId: clinical-context-profile
    proofSurfaceId: patient-profile
    actor: patient
    presentation:
      maxStaticHoldMs: 2200
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: bottom }
      opening: product-promise
    actions:
      - type: goto
        path: /en/profile
      - type: assert
        target: { by: role, role: heading, value: My Profile }
        state: visible
        timing: { pauseAfterMs: 1200 }
      - type: click
        target: { by: role, role: button, value: Chronic Conditions Add }
        timing: { cursorDurationMs: 520, settleBeforeMs: 160, pauseAfterMs: 600 }
      - type: click
        target: { by: role, role: button, value: "+ Migraine" }
        timing: { cursorDurationMs: 420, settleBeforeMs: 150, pauseAfterMs: 450 }
      - type: click
        target: { by: role, role: button, value: Save }
        timing: { cursorDurationMs: 420, settleBeforeMs: 150, pauseAfterMs: 1000 }
      - type: assert
        target: { by: role, role: button, value: Chronic Conditions 1 entry }
        state: visible
        timing: { pauseAfterMs: 650 }
      - type: click
        target: { by: role, role: button, value: Current Medications Add }
        timing: { cursorDurationMs: 480, settleBeforeMs: 160, pauseAfterMs: 600 }
      - type: click
        target: { by: role, role: button, value: "+ Ibuprofen" }
        timing: { cursorDurationMs: 420, settleBeforeMs: 150, pauseAfterMs: 450 }
      - type: click
        target: { by: role, role: button, value: Save }
        timing: { cursorDurationMs: 420, settleBeforeMs: 150, pauseAfterMs: 1100 }
      - type: assert
        target: { by: role, role: button, value: Current Medications 1 entry }
        state: visible
        timing: { pauseAfterMs: 1000 }

  - id: intake-opening
    title: "2 · Intake — Tell the story once"
    description: The patient starts in their own words, then answers one focused question at a time.
    purpose: interaction
    capabilityId: adaptive-intake
    proofSurfaceId: patient-intake
    actor: patient
    causalLink:
      fromSceneId: profile-context
      relationshipId: profile-to-intake
      evidence:
        - type: runtime
          url: http://localhost:3005/en/triage/interview
          observedAt: "2026-08-03T15:00:00.000Z"
          detail: The live interview snapshots the selected Clinical Context Profile.
    presentation:
      maxStaticHoldMs: 2400
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: bottom }
      actorTransition: context-card
    actions:
      - type: goto
        path: /en/triage/interview
      - type: fill
        target: { by: label, value: What brings you in today? }
        text: I have had a worsening throbbing headache for three days, with nausea and sensitivity to light and sound.
        timing: { cursorDurationMs: 520, settleBeforeMs: 170, keystrokeDelayMs: 16, pauseAfterMs: 700 }
      - type: click
        target: { by: role, role: button, value: Start }
        timing: { cursorDurationMs: 420, settleBeforeMs: 150, pauseAfterMs: 800 }
      - type: assert
        target: { by: role, role: heading, value: Here is what happens next }
        state: visible
        timing: { pauseAfterMs: 1500 }
      - type: click
        target: { by: role, role: button, value: Start the questions }
        timing: { cursorDurationMs: 430, settleBeforeMs: 150, pauseAfterMs: 1000 }
      - type: click
        target:
          by: rolePattern
          role: button
          pattern: "^(?:It feels|This feels).*(?:usual|typical).*migraine"
        timing: { cursorDurationMs: 440, settleBeforeMs: 900, pauseAfterMs: 700 }
      - type: click
        target:
          by: rolePattern
          role: button
          pattern: "^No(?:,| ).*(?:vision|strength|weakness|movement|speech|usual pain|these symptoms)"
        timing: { cursorDurationMs: 440, settleBeforeMs: 900, pauseAfterMs: 700 }
      - type: click
        target:
          by: rolePattern
          role: button
          pattern: "^(?:Neither|No,.*(?:none|neither|fever|stiff|vision|usual aura)|I don't have)"
        timing: { cursorDurationMs: 440, settleBeforeMs: 900, pauseAfterMs: 700 }
      - type: click
        target:
          by: rolePattern
          role: button
          pattern: "^(?:(?:It|The pain) has been constant|I feel (?:nauseated|nauseous|sick).*(?:(?:not|haven't) vomit|drink|fluids)|I took(?!.*(?:did not|not help)).*help|Yes,(?!.*(?:did not|not help)).*help(?:ed|s)?|Once or twice|1 or 2 (?:doses|times)|1 to 3 tablets|(?:It|The pain) is better but still there|(?:It|The pain) is getting worse(?!.*despite)|I feel clear-headed|No,.*(?:thinking|speaking|clear|vision|usual aura|eyes.*normal|bruising|bleeding)|No,.*(?:built up|came on) gradually|It built up over hours|It stays the same regardless|It is about the same as.*usual|(?:No, )?I have had (?:them|migraines) last this long before|A few doses each day|The pain stayed but felt less intense|The pain only eased slightly|It only dulled the pain slightly|The pain comes back quickly|It comes back when the medicine wears off|3(?: to 5)? days|It has stayed about the same|It is helping(?: a little)?|It only got a little better|It is helping as much as usual|Just nausea|I have nausea.*no vomiting|No, I have had worse|Yes,.*relief|I have taken it once or twice.*|It helps(?: for )?a little.*|No, none of (?:these|those)|I can eat and drink normally|It is much more painful now|I have nausea.*have not vomited|It only took the edge off|Only ibuprofen|It never fully went away|It got better but never fully left|The medicine helps(?: a bit)?|(?:It|The medicine|The pain)(?!.*(?:did not|not help|worse despite)).*(?:help|better|relief|less|edge off)|I can keep fluids and pills down|This is (?:a )?typical.*|Yes, this is normal for me|My blood pressure is normal|No,.*(?:scalp|temple).*tender)"
        timing: { cursorDurationMs: 440, settleBeforeMs: 900, pauseAfterMs: 750 }

