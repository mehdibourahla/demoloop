    presentation:
      maxStaticHoldMs: 2200
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: top }
      closing: outcome-recap
    actions:
      - type: assert
        target: { by: role, role: heading, value: Suggested workup }
        state: visible
        timing: { pauseAfterMs: 2200 }
