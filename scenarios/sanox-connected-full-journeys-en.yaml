        state: visible
        timing: { pauseAfterMs: 1100 }

  - id: patient-follow-up
    title: "3 · Follow-up — Complete what the form missed"
    description: The patient adds context, answers the follow-up, and refreshes the doctor handoff.
    purpose: result
    capabilityId: post-assessment-follow-up
    proofSurfaceId: patient-result
    actor: patient
    causalLink:
      fromSceneId: intake-completion
      relationshipId: assessment-to-follow-up
      evidence:
        - type: runtime
          url: http://localhost:3005/en/triage
          observedAt: "2026-08-03T15:12:00.000Z"
          detail: The live result offers a post-assessment completion chat and report revision.
    presentation:
      maxStaticHoldMs: 2600
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: top }
      actorTransition: context-card
    actions:
      - type: click
        target: { by: role, role: button, value: Complete or correct }
        timing: { cursorDurationMs: 450, settleBeforeMs: 150, pauseAfterMs: 900 }
      - type: fill
        target: { by: role, role: textbox, value: Describe your symptoms... }
        text: The pain is on both sides, and I had a similar migraine about two months ago. Please continue in English.
        timing: { cursorDurationMs: 450, settleBeforeMs: 150, keystrokeDelayMs: 18, pauseAfterMs: 650 }
      - type: click
        target: { by: role, role: button, value: Send }
        timing: { cursorDurationMs: 400, settleBeforeMs: 150, pauseAfterMs: 900 }
      - type: fill
        target: { by: role, role: textbox, value: Describe your symptoms... }
        text: I have had migraines since my twenties, and they have lasted three days before. I have no other medical conditions, recent head injury, or allergies beyond penicillin. My blood pressure was normal recently, and I only take ibuprofen during migraines. The pain built up gradually and is not worse with coughing, sneezing, bending over, or at a particular time of day. I also have no temple tenderness or jaw pain while eating or chewing. Please respond in English.
        timing: { cursorDurationMs: 430, settleBeforeMs: 150, keystrokeDelayMs: 16, pauseAfterMs: 650 }
      - type: click
        target: { by: role, role: button, value: Send }
        timing: { cursorDurationMs: 400, settleBeforeMs: 150, pauseAfterMs: 900 }
      - type: click
        optional: true
        timeoutMs: 1000
        target: { by: rolePattern, role: button, pattern: "^Send$" }
        timing: { cursorDurationMs: 320, settleBeforeMs: 120, pauseAfterMs: 600 }
      - type: assert
        target: { by: textPattern, pattern: "summary was updated|shar(?:e|ing|ed).*(?:doctor|medical team)|summary will be shared|intake is now complete|doctor will review this summary|gathered all the necessary information" }
        state: visible
        timing: { pauseAfterMs: 1200 }
      - type: click
        target: { by: roleAny, role: button, values: [Back to your assessment, Review it] }
        timing: { cursorDurationMs: 390, settleBeforeMs: 150, pauseAfterMs: 1200 }
      - type: assert
        target: { by: role, role: heading, value: Your assessment }
        state: visible
        timing: { pauseAfterMs: 1100 }
      - type: click
        target: { by: role, role: button, value: Join the queue }
        timing: { cursorDurationMs: 470, settleBeforeMs: 160, pauseAfterMs: 1000 }
      - type: assert
        target: { by: textPattern, pattern: "Your place in line|You're next|In queue" }
        state: visible
        timing: { pauseAfterMs: 1800 }

  - id: doctor-handoff
    title: "4 · Doctor — The same story, already structured"
    description: The doctor opens the patient created moments ago, with profile, brief and transcript intact.
    purpose: handoff
    capabilityId: doctor-brief
    proofSurfaceId: doctor-today
    actor: doctor
    causalLink:
      fromSceneId: patient-follow-up
      relationshipId: patient-doctor-handoff
      transitionId: queued-to-doctor-review
      evidence:
        - type: user
          confirmedBy: product owner
          confirmedAt: "2026-08-03T15:30:00.000Z"
          detail: The public demo must follow the exact patient-created case into the doctor view.
    presentation:
      maxStaticHoldMs: 2500
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: bottom }
      actorTransition: split-causality
    actions:
      - type: goto
        path: /en/doctor/today
      - type: assert
        target: { by: text, value: "Ordered by medical urgency, then wait time, not arrival order" }
        state: visible
        timing: { pauseAfterMs: 1200 }
      - type: click
        target: { by: text, value: "I have had a worsening throbbing headache for three days, with nausea and sensitivity to light and sound." }
        timing: { cursorDurationMs: 540, settleBeforeMs: 170, pauseAfterMs: 1000 }
      - type: assert
        target: { by: text, value: Pre-consult brief }
        state: visible
        timing: { pauseAfterMs: 1500 }
      - type: assert
        target: { by: textPattern, pattern: "History of migraine.*Ibuprofen.*Penicillin" }
        state: visible
        timing: { pauseAfterMs: 1300 }
      - type: click
        target: { by: role, role: button, value: View full conversation }
        timing: { cursorDurationMs: 480, settleBeforeMs: 150, pauseAfterMs: 900 }
      - type: assert
        target: { by: role, role: heading, value: Full conversation transcript }
        state: visible
        timing: { pauseAfterMs: 1800 }
      - type: click
        target: { by: role, role: button, value: Close }
        timing: { cursorDurationMs: 420, settleBeforeMs: 150, pauseAfterMs: 800 }
      - type: scroll
        deltaY: 620
        timing: { pauseAfterMs: 700 }
      - type: click
        target: { by: role, role: button, value: Correct }
        timing: { cursorDurationMs: 430, settleBeforeMs: 150, pauseAfterMs: 900 }
      - type: assert
        target: { by: text, value: Clinical context }
        state: visible
        timing: { pauseAfterMs: 1200 }
      - type: scroll
        deltaY: 620
        timing: { pauseAfterMs: 700 }
      - type: assert
        target: { by: role, role: heading, value: AI differential }
        state: visible
        timing: { pauseAfterMs: 1300 }
      - type: scroll
        deltaY: 620
        timing: { pauseAfterMs: 700 }
      - type: assert
        target: { by: role, role: heading, value: Suggested workup }
        state: visible
        timing: { pauseAfterMs: 1500 }

  - id: outcome-close
    title: SanoX
    description: One patient story. Structured, completed and carried into care.
    purpose: close
    capabilityId: doctor-brief
    proofSurfaceId: doctor-consult
    actor: doctor
    causalLink:
      fromSceneId: doctor-handoff
      relationshipId: doctor-accountability
      evidence:
