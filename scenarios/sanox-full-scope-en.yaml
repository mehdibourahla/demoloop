version: 1
id: sanox-full-scope-en
title: SanoX — Clinical operations from intake to oversight
audience: public
locale: en-CA
duration: 2m
narration: captions
branding:
  name: SanoX
  primary: "#0f766e"
  background: "#071b19"
preconditions: {}
actors:
  - id: visitor
    role: visitor
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-full-scope-en/auth/visitor.json
  - id: patient
    role: patient
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-full-scope-en/auth/patient.json
  - id: doctor
    role: doctor
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-full-scope-en/auth/doctor.json
  - id: admin
    role: admin
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-full-scope-en/auth/admin.json
  - id: medical-team
    role: medical-team
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-full-scope-en/auth/medical-team.json
scenes:
  - id: product-promise
    title: Patients arrive already interviewed
    description: SanoX prepares a structured clinical brief before the consultation begins.
    actor: visitor
    actions:
      - title: Open SanoX
        type: goto
        path: /en
      - title: Establish the product promise
        type: assert
        target:
          by: role
          role: heading
          value: Patients arrive already interviewed. You open on the brief.
        state: visible
        timing:
          pauseAfterMs: 3500
      - title: Show the clinic model
        type: scroll
        target:
          by: text
          value: One plan per doctor, per month
        timing:
          pauseAfterMs: 3500
      - title: Confirm the included workflow
        type: assert
        target:
          by: text
          value: Pre-consult brief
        state: visible
        timing:
          pauseAfterMs: 2500
  - id: structured-intake
    title: Structured intake, with the clinician in control
    description: Patients answer adaptive questions while safety boundaries remain explicit.
    actor: visitor
    actions:
      - title: Open the workflow explanation
        type: goto
        path: /en/how-it-works
      - title: Introduce the workflow
        type: assert
        target:
          by: role
          role: heading
          value: How SanoX works
        state: visible
        timing:
          pauseAfterMs: 2500
      - title: Show the structured interview
        type: scroll
        target:
          by: role
          role: heading
          value: 2. The AI conducts a structured interview
        timing:
          pauseAfterMs: 3500
      - title: Show the triage report
        type: scroll
        target:
          by: role
          role: heading
          value: 3. You receive a triage report
        timing:
          pauseAfterMs: 3500
      - title: Keep the boundary visible
        type: assert
        target:
          by: role
          role: heading
          value: What SanoX does not do
        state: visible
        timing:
          pauseAfterMs: 2500
  - id: patient-live-visit
    title: The patient always knows what happens next
    description: Live visit status removes uncertainty without exposing the clinical queue.
    actor: patient
    actions:
      - title: Open the active visit
        type: goto
        path: /en/visit
      - title: Verify the patient call state
        type: assert
        target:
          by: text
          value: You're being called
        state: visible
        timing:
          pauseAfterMs: 3500
      - title: Verify the next step
        type: assert
        target:
          by: text
          value: Dr. Karim Benali is ready. Head to the front desk.
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Hold the progress timeline
        type: assert
        target:
          by: role
          role: heading
          value: You're next
        state: visible
        timing:
          pauseAfterMs: 2500
  - id: doctor-cockpit
    title: The doctor opens on an operational cockpit
    description: Daily workload, time saved, and AI calibration appear in one focused view.
    actor: doctor
    actions:
      - title: Open the doctor dashboard
        type: goto
        path: /en/doctor/dashboard
      - title: Verify the doctor cockpit
        type: assert
        target:
          by: role
          role: heading
          value: Welcome, Dr. Benali
        state: visible
        timing:
          pauseAfterMs: 2500
      - title: Show time saved
        type: assert
        target:
          by: text
          value: Time you saved
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Show AI calibration
        type: assert
        target:
          by: text
          value: AI calibration
        state: visible
        timing:
          pauseAfterMs: 3000
  - id: doctor-appointments
    title: Every visit keeps its clinical priority
    description: Past consultations retain complaint, urgency, specialty, and review status.
    actor: doctor
    actions:
      - title: Open appointments
        type: goto
        path: /en/doctor/appointments
      - title: Open past visits
        type: click
        target:
          by: text
          value: Past
        timing:
          cursorDurationMs: 650
          settleBeforeMs: 180
          pauseAfterMs: 3000
      - title: Verify a completed intake
        type: assert
        target:
          by: text
          value: Dry cough and sore throat
        state: visible
        timing:
          pauseAfterMs: 3500
      - title: Verify review status
        type: assert
        target:
          by: text
          value: Approved
        state: visible
        timing:
          pauseAfterMs: 2500
  - id: clinical-intelligence
    title: Clinical intelligence is reviewable, not opaque
    description: The doctor sees the summary, differential, evidence, gaps, and suggested workup.
    actor: doctor
    actions:
      - title: Open a completed appointment
        type: goto
        path: /en/doctor/appointments/f8811258-1797-4c55-b321-f015602397b7
      - title: Focus the triage report
        type: scroll
        target:
          by: text
          value: Triage Report
        timing:
          pauseAfterMs: 3000
      - title: Verify the AI differential
        type: assert
        target:
          by: text
          value: AI differential
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Focus the suggested workup
        type: scroll
        target:
          by: text
          value: Suggested workup
        timing:
          pauseAfterMs: 3500
      - title: Keep physician authorization visible
        type: assert
        target:
          by: text
          value: "Decision support: the physician authorizes every order."
        state: visible
        timing:
          pauseAfterMs: 3000
  - id: doctor-availability
    title: Clinic controls stay in the same workspace
    description: Availability can be managed without leaving the doctor's clinical flow.
    actor: doctor
    actions:
      - title: Open availability
        type: goto
        path: /en/doctor/availability
      - title: Verify availability management
        type: assert
        target:
          by: role
          role: heading
          value: Availability
        state: visible
        timing:
          pauseAfterMs: 2500
      - title: Verify slot controls
        type: assert
        target:
          by: role
          role: button
          value: Add slot
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Show the weekly schedule
        type: scroll
        deltaY: 320
        timing:
          pauseAfterMs: 3000
  - id: platform-analytics
    title: Operations and clinical quality share one scorecard
    description: Pilot ROI and model trends are measured instead of inferred.
    actor: admin
    actions:
      - title: Open platform analytics
        type: goto
        path: /en/admin
      - title: Verify platform analytics
        type: assert
        target:
          by: role
          role: heading
          value: Admin dashboard
        state: visible
        timing:
          pauseAfterMs: 2500
      - title: Show triage completion
        type: assert
        target:
          by: text
          value: Triage completion rate
        state: visible
        timing:
          pauseAfterMs: 2500
      - title: Focus pilot ROI
        type: scroll
        target:
          by: text
          value: Pilot ROI (last 30 days)
        timing:
          pauseAfterMs: 3500
      - title: Focus quality trends
        type: scroll
        target:
          by: text
          value: Model quality trend (last 30 days)
        timing:
          pauseAfterMs: 3500
  - id: clinic-operations
    title: Clinics and doctor rosters remain visible
    description: Platform operations can onboard and monitor pilot clinics from one place.
    actor: admin
    actions:
      - title: Open clinic operations
        type: goto
        path: /en/admin/clinics
      - title: Verify clinic operations
        type: assert
        target:
          by: text
          value: Clinics
        state: visible
        timing:
          pauseAfterMs: 2500
      - title: Verify clinic creation
        type: assert
        target:
          by: role
          role: button
          value: Create clinic
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Verify the pilot clinic
        type: assert
        target:
          by: text
          value: SanoX Clinic
        state: visible
        timing:
          pauseAfterMs: 3000
  - id: medical-governance
    title: Human review closes the clinical loop
    description: The medical team audits generated reports before clinicians finalize delivery.
    actor: medical-team
    actions:
      - title: Open the medical audit log
        type: goto
        path: /en/medical-team/triage-audit
      - title: Verify the audit surface
        type: assert
        target:
          by: role
          role: heading
          value: Triage audit log
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Verify the review mandate
        type: assert
        target:
          by: text
          value: Review chatbot-generated reports and edit them if needed before clinicians finalize delivery.
        state: visible
        timing:
          pauseAfterMs: 3000
      - title: Hold the review queue
        type: assert
        target:
          by: text
          value: Pending review
        state: visible
        timing:
          pauseAfterMs: 3500
