      caption: { mode: lower-third, safeArea: bottom }
    actions:
      - type: click
        target: { by: role, role: button, value: Start }
        timing: { cursorDurationMs: 320, settleBeforeMs: 100, pauseAfterMs: 400 }
      - type: assert
        target: { by: role, role: heading, value: Here is what happens next }
        state: visible
        timing: { pauseAfterMs: 1400 }

