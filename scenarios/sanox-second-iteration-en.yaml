version: 2
id: sanox-second-iteration-en
title: SanoX — From patient story to accountable clinical action
outputType: public-master
audience: clinics evaluating AI-assisted clinical operations
locale: en-CA
requestedDurationSeconds: 32
audio:
  policy: silent
branding:
  name: SanoX
  primary: "#42c5d5"
  background: "#171039"
preconditions:
  seedCommand: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -f /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/seed-english-demo.sql
actors:
  - id: patient
    label: Patient
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/auth/patient.json
  - id: doctor
    label: Doctor
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/auth/doctor.json
  - id: medical-team
    label: Medical team
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-second-iteration-en/auth/medical-team.json
scenes:
  - id: opening-promise
    title: From patient story to doctor-ready brief
    description: SanoX prepares the consultation before the clinician opens the chart.
    purpose: hook
    capabilityId: adaptive-intake
    proofSurfaceId: patient-intake
    actor: patient
    presentation:
      maxStaticHoldMs: 3000
      regionOfInterest: { x: 0.30, y: 0.06, width: 0.55, height: 0.42 }
      camera: { type: zoom, scale: 1.06, to: { x: 0.30, y: 0.06, width: 0.55, height: 0.42 } }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: bottom }
      opening: product-promise
    actions:
      - type: goto
        path: /en/triage
      - type: assert
        target: { by: role, role: heading, value: See a doctor }
        state: visible
        timing: { pauseAfterMs: 1400 }

  - id: patient-story
    title: Start with the patient's own words
    description: One clear complaint becomes the starting point for a structured intake.
    purpose: interaction
    capabilityId: adaptive-intake
    proofSurfaceId: patient-intake
    actor: patient
    presentation:
      maxStaticHoldMs: 3000
      regionOfInterest: { x: 0.40, y: 0.10, width: 0.36, height: 0.40 }
      camera: { type: zoom, scale: 1.10, to: { x: 0.40, y: 0.10, width: 0.36, height: 0.40 } }
      loading: cut
      transitionWeight: meaningful
      caption: { mode: lower-third, safeArea: bottom }
    actions:
      - type: goto
        path: /en/triage/interview
      - type: fill
        target: { by: label, value: What brings you in today? }
        text: I have had a worsening throbbing headache for three days, with nausea and sensitivity to light and sound.
        timing: { cursorDurationMs: 380, settleBeforeMs: 120, keystrokeDelayMs: 8, pauseAfterMs: 300 }

  - id: intake-contract
    title: Short, adaptive, and explicit
    description: The patient knows the limit, the next step, and what the doctor will receive.
    purpose: state-change
    capabilityId: adaptive-intake
    proofSurfaceId: patient-intake
    actor: patient
    causalLink:
      fromSceneId: patient-story
      transitionId: story-to-brief
      evidence:
        - type: runtime
          url: http://localhost:3005/en/triage/interview
          observedAt: "2026-08-03T02:32:34.000Z"
          detail: The Start action opens the interview contract in the real app.
    presentation:
      maxStaticHoldMs: 3000
      regionOfInterest: { x: 0.40, y: 0.08, width: 0.36, height: 0.68 }
      camera: { type: zoom, scale: 1.08, to: { x: 0.40, y: 0.08, width: 0.36, height: 0.68 } }
