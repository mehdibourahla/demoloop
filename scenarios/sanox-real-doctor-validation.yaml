version: 1
id: sanox-real-doctor-validation
title: SanoX Doctor Workspace
audience: clinic-partner
locale: en-CA
duration: 35s
narration: voiceover
branding:
  name: SanoX
  primary: "#0f766e"
  background: "#071b19"
preconditions: {}
actors:
  - id: doctor
    role: doctor
    storageState: /Users/mehdibourahla/Documents/product-demo/artifacts/sanox-real-validation-en/auth/doctor.json
scenes:
  - id: operational-overview
    title: Clinical operations at a glance
    description: The real SanoX doctor dashboard turns clinical activity into an actionable daily overview.
    actor: doctor
    actions:
      - title: Open the doctor dashboard
        type: goto
        path: /en/doctor/dashboard
        narration: SanoX gives every doctor a clear operational view of the day, directly inside the real clinical workspace.
        timing:
          pauseAfterMs: 5000
      - title: Verify time saved
        type: assert
        target:
          by: text
          value: Time you saved
        state: visible
        narration: Time saved, patient activity, pending reviews, and AI calibration are visible in one place.
        timing:
          pauseAfterMs: 5000
  - id: urgency-ordered-queue
    title: A queue built around medical urgency
    description: SanoX prioritizes the doctor's work by clinical urgency and waiting time.
    actor: doctor
    actions:
      - title: Open today's queue
        type: click
        target:
          by: text
          value: Today
        narration: From the dashboard, the doctor moves into a live queue ordered by medical urgency and waiting time.
        timing:
          cursorDurationMs: 650
          settleBeforeMs: 180
          pauseAfterMs: 5000
      - title: Verify urgency ordering
        type: assert
        target:
          by: text
          value: Ordered by medical urgency, then wait time, not arrival order
        state: visible
        narration: This keeps attention on the patients who need it most, instead of using a simple first come, first served list.
        timing:
          pauseAfterMs: 5000
  - id: clinic-control
    title: Clinic controls stay close
    description: Scheduling controls remain one click away from the care workflow.
    actor: doctor
    actions:
      - title: Open availability
        type: click
        target:
          by: text
          value: Availability
        narration: Clinic controls stay close to care delivery, with availability managed from the same doctor workspace.
        timing:
          cursorDurationMs: 700
          settleBeforeMs: 180
          pauseAfterMs: 5000
      - title: Verify availability controls
        type: assert
        target:
          by: role
          role: button
          value: Add slot
        state: visible
        narration: This short preview uses the actual SanoX application, authenticated QA data, and an English voiceover.
        timing:
          pauseAfterMs: 5000
