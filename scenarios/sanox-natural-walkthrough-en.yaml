        deltaY: 560
        timing: { pauseAfterMs: 1000 }
      - type: click
        target: { by: role, role: button, value: Correct }
        timing: { cursorDurationMs: 520, settleBeforeMs: 160, pauseAfterMs: 900 }
      - type: scroll
        deltaY: 620
        timing: { pauseAfterMs: 1000 }
      - type: assert
        target: { by: role, role: heading, value: Clinical context }
        state: visible
        timing: { pauseAfterMs: 2000 }
      - type: scroll
        deltaY: 1180
        timing: { pauseAfterMs: 1000 }
