    presentation:
      maxStaticHoldMs: 2500
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: none }
      actorTransition: split-causality
    actions:
      - type: goto
        path: /en/doctor/appointments/261ebd4c-1651-42cb-b3ff-0cdab6d3ee15
      - type: assert
        target: { by: text, value: Pre-consult brief }
        state: visible
        timing: { pauseAfterMs: 2200 }
