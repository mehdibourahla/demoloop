  - id: urgent-operations
    title: Urgent operations
    description: The live queue brings the patients who need attention first into focus.
    purpose: proof
    capabilityId: clinical-oversight
    proofSurfaceId: doctor-today
    actor: doctor
    presentation:
      maxStaticHoldMs: 2500
      camera: { type: none }
      loading: cut
      transitionWeight: meaningful
      caption: { mode: none }
    actions:
      - type: goto
        path: /en/doctor/today
      - type: assert
        target: { by: text, value: "Ordered by medical urgency, then wait time, not arrival order" }
