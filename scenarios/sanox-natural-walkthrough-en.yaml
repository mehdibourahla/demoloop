scenes:
  - id: patient-intake
    title: From the patient's words to a doctor-ready brief
    description: SanoX structures the story before the consultation begins.
    purpose: hook
    capabilityId: adaptive-intake
    proofSurfaceId: patient-intake
    actor: patient
    presentation:
      maxStaticHoldMs: 2500
      camera: { type: none }
      loading: cut
      transitionWeight: major
      caption: { mode: lower-third, safeArea: bottom }
      opening: product-promise
    actions:
      - type: goto
        path: /en/triage/interview
      - type: fill
        target: { by: label, value: What brings you in today? }
        text: I have had a worsening throbbing headache for three days, with nausea and sensitivity to light and sound.
        timing: { cursorDurationMs: 520, settleBeforeMs: 160, keystrokeDelayMs: 14, pauseAfterMs: 700 }
      - type: click
        target: { by: role, role: button, value: Start }
        timing: { cursorDurationMs: 420, settleBeforeMs: 140, pauseAfterMs: 700 }
      - type: assert
        target: { by: role, role: heading, value: Here is what happens next }
        state: visible
        timing: { pauseAfterMs: 2200 }

