[project]
name = "demoloop-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "demoloop-core",
    "fastapi>=0.123,<1",
    "uvicorn[standard]>=0.40,<1",
    "httpx>=0.27,<1",
    "sqladmin>=0.20,<1",
    "itsdangerous>=2.2,<3",
]

[tool.uv.sources]
demoloop-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoloop_api"]
