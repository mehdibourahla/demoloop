[project]
name = "demoloop-core"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "litellm>=1.81,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoloop_core"]
