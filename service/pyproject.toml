[tool.uv.workspace]
members = ["packages/libs/*", "packages/apps/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends() in argument defaults is the framework's documented idiom.
ignore = ["B008"]
