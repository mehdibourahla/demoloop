services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: demoloop
      POSTGRES_PASSWORD: demoloop
      POSTGRES_DB: demoloop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demoloop"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: demoloop
      MINIO_ROOT_PASSWORD: demoloop123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
