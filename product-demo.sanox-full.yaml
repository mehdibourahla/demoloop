app:
  url: http://localhost:3005
  healthcheck: http://127.0.0.1:8001/health/ready
  production: false
repository:
  root: ../Workspace/Personal/sanox
output:
  directory: artifacts
privacy:
  syntheticData: false
  allowProduction: false
  scanArtifacts: true
  redactions:
    - sourceEnv: SANOX_DEMO_PATIENT_NAME
      replacement: Demo Patient
runtime:
  rehearsalPasses: 2
  headless: true
narration:
  provider: none
upload:
  enabled: false
devices:
  desktop:
    width: 1440
    height: 900
    isMobile: false
