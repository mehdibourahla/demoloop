services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: demoloop
      POSTGRES_PASSWORD: demoloop
      POSTGRES_DB: demoloop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demoloop"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: demoloop
      MINIO_ROOT_PASSWORD: demoloop123
    ports: ["9000:9000", "9001:9001"]

  api:
    build: { context: ./service }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DEMOLOOP_ENV: dev
      DEMOLOOP_DATABASE_URL: postgresql+asyncpg://demoloop_app:demoloop_app@postgres:5432/demoloop
      DEMOLOOP_ADMIN_DATABASE_URL: postgresql+asyncpg://demoloop:demoloop@postgres:5432/demoloop
      DEMOLOOP_DISPATCH_DATABASE_URL: postgresql+asyncpg://demoloop_dispatch:demoloop_dispatch@postgres:5432/demoloop
      DEMOLOOP_STORAGE_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]

  # The cloud worker and a customer's self-hosted runner are this same image; they differ
  # by DEMOLOOP_KINDS and by which network they sit in.
  worker:
    build: { context: . }
    depends_on: [api]
    environment:
      DEMOLOOP_API: http://api:8000
      DEMOLOOP_RUNNER_TOKEN: development-only
      DEMOLOOP_KINDS: capture,render,evaluate
